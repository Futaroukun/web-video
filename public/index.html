<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>StreamHub • Portal Video</title>
  
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Header / Navbar -->
  <header class="app-header">
    <div class="header-container">
      <a href="/" class="brand" id="brandBtn">
        <span class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </span>
        <span class="brand-name">Stream<span class="accent-text">Hub</span></span>
      </a>

      <!-- Search Box -->
      <div class="search-box">
        <span class="search-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <input type="text" id="searchInput" placeholder="Cari judul video..." autocomplete="off">
        <button id="clearSearchBtn" class="clear-btn" style="display: none;">✕</button>
      </div>

      <!-- Nav Actions (Desktop / Tablet) -->
      <div class="header-actions">
        <button id="navBookmarksBtn" class="action-btn" title="Daftar Favorit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span>Favorit</span>
        </button>
        <button id="navHistoryBtn" class="action-btn" title="Riwayat Tontonan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>Riwayat</span>
        </button>
      </div>
    </div>

    <!-- Category Chips -->
    <div class="categories-bar">
      <div class="categories-scroll" id="categoriesContainer">
        <button class="chip active" data-cat="">Semua</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <section id="catalogView" class="catalog-section">
      <div class="content-header">
        <div class="section-title-wrap">
          <h2 id="sectionTitle">Video Terbaru</h2>
          <span id="videoCountBadge" class="count-badge">Memuat...</span>
        </div>
        <div class="filter-indicator" id="filterIndicator" style="display: none;">
          <span id="filterLabel">Filter aktif</span>
          <button id="resetFilterBtn">Reset ✕</button>
        </div>
      </div>

      <!-- Video Grid -->
      <div class="video-grid" id="videoGrid"></div>

      <!-- Numbered Pagination -->
      <nav class="pagination-container" id="paginationContainer" aria-label="Navigasi Halaman"></nav>
    </section>
  </main>

  <!-- Drawer Modal for Bookmarks & History -->
  <div class="drawer-overlay" id="drawerModal">
    <div class="drawer-content">
      <div class="drawer-header">
        <h3 id="drawerTitle">Favorit</h3>
        <button id="closeDrawerBtn" class="close-drawer-btn">✕</button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
    </div>
  </div>

  <!-- Mobile Bottom Navigation (Kompak Tanpa Emoji) -->
  <nav class="mobile-nav">
    <button class="mobile-nav-item active" id="mobHomeBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </button>
    <button class="mobile-nav-item" id="mobSearchBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Cari</span>
    </button>
    <button class="mobile-nav-item" id="mobFavBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <span>Favorit</span>
    </button>
    <button class="mobile-nav-item" id="mobHistBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>Riwayat</span>
    </button>
  </nav>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
